# ─────────────────────────────────────────────────────────────────────────────
# Trace pipeline
#
#   Python app  ──OTLP gRPC──►  OTel Collector (4317)
#                                      │
#                              OTLP HTTP /v1/traces
#                                      │
#                                      ▼
#                            Arize Phoenix (6006)
#
# Start:  docker compose up -d
# UI:     http://localhost:6006
# ─────────────────────────────────────────────────────────────────────────────

services:
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"   # Phoenix UI + OTLP HTTP receiver (/v1/traces)
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
    volumes:
      - phoenix_data:/mnt/data
    healthcheck:
      test: ["CMD", "/usr/bin/python3.13", "-c", "import socket; s=socket.create_connection(('localhost', 6006), 2); s.close()"]
      interval: 5s
      timeout: 4s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    ports:
      - "14317:4317"   # OTLP gRPC — app sends traces here (host:14317 → container:4317)
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      phoenix:
        condition: service_healthy

volumes:
  phoenix_data:
